<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" role="img" aria-labelledby="heading desc">
<title id="heading">nf-clone-consensus workflow</title>
<desc id="desc">Inputs: HIV or SIV FASTA reads, integration sites, and the best HIV reference supplied per sample. Group by patient and site, trim terminal Ns and align fragments to the patient reference, count each sample ID and PCR ID family once, then call clone consensus sequences. Output clone consensus FASTAs, read alignments, merged FASTAs, and summary CSVs directly under results.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#17427c"/></marker></defs>
<rect width="1600" height="790" fill="#fff"/>

